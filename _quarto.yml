      - section: Four Dharmas of Gampopa
        href: gampopa/index.qmd
        contents:
          - gampopa/mind-one-with-dharma.qmd
          - gampopa/dharma-progress-along-path.qmd
          - gampopa/path-clarify-confusion.qmd
          - gampopa/confusion-dawn-as-wisdom.qmd
      - section: Musings
        href: musings/index.qmd
        contents:
        - musings/earth-touching.qmd
        - musings/sutras.qmd
        - musings/indonesia.qmd
